[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sentinel"
version = "0.1.0"
description = "Real-time transaction decisioning: latency-budgeted rules, duplicate-safe ingestion and a reconstructable audit trail."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ishaq Ansary" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "psycopg[binary,pool]>=3.2",
  "starlette>=0.46",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "hypothesis>=6.120",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E", "W", "F",  # pycodestyle, pyflakes
  "I",            # import order
  "B",            # bugbear
  "UP",           # pyupgrade
  "SIM",          # simplify
  "C4",           # comprehensions
  "RUF",          # ruff-specific
  "S",            # bandit (security)
  "DTZ",          # timezone-naive datetimes are bugs in a ledger
  "PT",           # pytest style
  "N",            # naming
  "PERF",         # performance anti-patterns
  "RET",          # return hygiene
  "TRY",          # exception hygiene
]
ignore = [
  "TRY003",  # long messages on typed errors are intentional: the code is the contract
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "S608"]
"scripts/**" = ["S311"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = ["db: needs a real PostgreSQL (SENTINEL_TEST_DATABASE_URL)"]
xfail_strict = true
filterwarnings = ["error"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = ["sentinel"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "^\\s*\\.\\.\\.$",
  "if __name__ == .__main__.:",
]
